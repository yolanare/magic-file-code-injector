<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>magic-file-code-injector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>magic-file-code-injector</h1>
        <div class="header-actions">
          <button id="open-options" class="button button-secondary" type="button">Options</button>
          <button id="refresh-model" class="button button-secondary" type="button">Refresh</button>
        </div>
      </header>

      <section class="panel">
        <div class="row">
          <span class="label">Domain</span>
          <span id="host-value" class="mono">-</span>
        </div>
        <div class="row">
          <span class="label">Server</span>
          <span id="server-value" class="mono">-</span>
        </div>
        <div id="status-message" class="status"></div>
      </section>

      <section class="panel">
        <label class="checkbox-row" for="auto-refresh-js">
          <input id="auto-refresh-js" type="checkbox" />
          <span>Auto-refresh page when JS updates</span>
        </label>
        <div id="pending-js" class="status status-warning hidden"></div>
      </section>

      <section class="panel">
        <h2>Available files</h2>
        <div id="files-list" class="files-list"></div>
      </section>
    </main>

    <script src="js/popup.js"></script>
  </body>
</html>
